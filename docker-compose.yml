version: '3.8'

services:
  infrapm-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrapm-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - INFRAPM_DB_CONNECTION=${INFRAPM_DB_CONNECTION}
      - INFRAPM_JWT_SECRET=${INFRAPM_JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT__ValidAudience=${FRONTEND_URL}
      - JWT__ValidIssuer=http://localhost:8080
      - DEFAULT_SUPERUSER_PASSWORD=${DEFAULT_SUPERUSER_PASSWORD}
    volumes:
      # Mount the image storage to the host VPS so uploaded images persist if the container is recreated
      - ./infrapm_data/images:/app/Storage/Images
    networks:
      - infrapm-network

  infrapm-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infrapm-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Tell Next.js where the backend container lives for the API rewrites proxy
      - BACKEND_INTERNAL_URL=http://infrapm-backend:8080
    env_file:
      - .env
    networks:
      - infrapm-network
    depends_on:
      - infrapm-backend

networks:
  infrapm-network:
    driver: bridge